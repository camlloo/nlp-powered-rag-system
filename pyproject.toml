[project]
name = "nlp-powered-rag-system"
version = "0.1.0"
description = "Traditional NLP document processing and MySQL 9 backed RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<0.5",
  "alembic>=1.14,<2",
  "openai>=1.60,<3",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "jieba==0.42.1",
  "rank-bm25>=0.2.2,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的标准写法（File/Header/Depends 出现在参数默认值）
"app/api/**" = ["B008"]

